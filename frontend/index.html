<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e5a54" />
    <title>نظام الموارد البشرية - الكويت</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* بصمة Operon — تُحمَّل من سكربت خارجي يضع نفسه بـz-index أقصى
         (2147483000)، فكانت ستطفو فوق كل نافذة حوار في النظام ونوافذ
         الجولة التعليمية. نخفضها هنا تحت أدنى طبقة تفاعلية (999) فتبقى
         ظاهرة على الصفحة ولا تعترض شيًئا فوقها.
         وتُخفى عند الطباعة: المستندات الرسمية تُطبع من المتصفح. */
      /* الموضع منطقي لا ثابت: inset-inline-end يعني اليسار في العربية
         واليمين في الإنجليزية — أي أن البصمة تقع دائًما في نهاية اتجاه
         القراءة، بعيًدا عن حيث تبدأ العين. والسكربت يكتب left/right مباشرة
         في النمط المضمَّن، فنُبطلهما أوًلا ثم نضع المنطقي بعدهما.
         و dir يتبدّل مع اللغة (i18n.tsx:703) فتنتقل البصمة بلا إعادة تحميل. */
      #operon-signature {
        z-index: 900 !important;
        left: auto !important;
        right: auto !important;
        inset-inline-end: 16px !important;
        /* فوق شريط تحديث الـPWA: كلاهما في نفس الزاوية، والتراكب يخفي أحدهما */
        bottom: 76px !important;
      }
      @media print { #operon-signature { display: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- أسفل-اليمين: أسفل-اليسار مشغول بإشعار تحديث الـPWA
         (insetInlineEnd في واجهة RTL). الذهب من لوحة الهوية لا البنفسجي
         الافتراضي، فتبدو البصمة جزًءا من التصميم لا ملصًقا عليه. -->
    <script src="/operon-signature.min.js" defer
            data-url="https://operon-site.web.app/"
            data-position="bottom-right"
            data-accent="#c9a227"
            data-offset="16"
            data-theme="auto"></script>
  </body>
</html>
