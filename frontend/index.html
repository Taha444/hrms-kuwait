<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e5a54" />
    <title>نظام الموارد البشرية - الكويت</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* بصمة Operon — تُحمَّل من سكربت خارجي يضع نفسه بـz-index أقصى
         (2147483000)، فكانت ستطفو فوق كل نافذة حوار في النظام ونوافذ
         الجولة التعليمية. نخفضها هنا تحت أدنى طبقة تفاعلية (999) فتبقى
         ظاهرة على الصفحة ولا تعترض شيًئا فوقها.
         وتُخفى عند الطباعة: المستندات الرسمية تُطبع من المتصفح. */
      /* البصمة: موضعها محسوب لا عشوائي.
         - inset-inline-end يعني اليسار في العربية واليمين في الإنجليزية،
           أي نهاية اتجاه القراءة وبعيًدا عن الشريط الجانبي في الحالتين.
         - 26px هو padding المحتوى نفسه (styles.css:206)، فتقف البصمة على
           نفس شبكة البطاقات لا على رقم مخترع — وهذا وحده الفرق بين
           «موضوعة» و«مركونة».
         - هادئة حتى تُقصَد: نصف شفافية تكتمل عند المرور، فتُرى ولا تنافس
           محتوى الصفحة على الانتباه. */
      #operon-signature {
        z-index: 900 !important;
        left: auto !important;
        right: auto !important;
        inset-inline-end: 26px !important;
        bottom: 26px !important;
        opacity: .55;
        transition: opacity .25s ease;
      }
      #operon-signature:hover { opacity: 1; }
      /* الجوّال: نفس إيقاع الحافة المصغَّر (styles.css:412) */
      @media (max-width: 900px) {
        #operon-signature {
          inset-inline-end: 18px !important;
          bottom: 18px !important;
        }
      }
      @media print { #operon-signature { display: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- أسفل-اليمين: أسفل-اليسار مشغول بإشعار تحديث الـPWA
         (insetInlineEnd في واجهة RTL). الذهب من لوحة الهوية لا البنفسجي
         الافتراضي، فتبدو البصمة جزًءا من التصميم لا ملصًقا عليه. -->
    <script src="/operon-signature.min.js" defer
            data-url="https://operon-site.web.app/"
            data-position="bottom-right"
            data-accent="#c9a227"
            data-offset="16"
            data-theme="auto"></script>
  </body>
</html>
